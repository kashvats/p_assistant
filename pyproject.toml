[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "living-assistant"
version = "0.9.2"
description = "Local-first personal operating assistant with evaluated self-improvement, defensive Security Guardian, sleeping agents and deterministic automation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "psutil>=6,<8",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "platformdirs>=4,<5",
  "python-dotenv>=1,<2",
  "typer>=0.12,<1",
  "rich>=13,<15",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]
[project.optional-dependencies]
desktop = [
  "pyperclip>=1.9,<2",
  "mss>=9,<11",
  "Pillow>=10,<12",
  "pystray>=0.19,<1",
  "customtkinter>=5.2,<6",
]
browser = [
  "playwright>=1.45,<2",
]
voice = [
  "sounddevice>=0.4,<1",
  "numpy>=1.26,<3",
  "faster-whisper>=1,<2",
  "pyttsx3>=2.90,<3",
]
db = [
  "psycopg[binary]>=3.2,<4",
  "pymysql>=1.1,<2",
  "pymongo>=4.8,<5",
]
dev = [
  "pytest>=8,<10",
]

[project.scripts]
organism = "living_assistant.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
living_assistant = ["default_config.yaml", "default_skills.json", "webui/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
