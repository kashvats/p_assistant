[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "living-assistant"
version = "0.9.2"
description = "Local-first personal operating assistant with evaluated self-improvement, defensive Security Guardian, sleeping agents and deterministic automation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "psutil>=6,<8",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "platformdirs>=4,<5",
  "python-dotenv>=1,<2",
  "typer>=0.12,<1",
  "rich>=13,<15",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "diskcache>=5.6,<6",
  "watchdog>=6,<7",
  "apscheduler>=3.10,<4",
  "trafilatura>=2,<3",
  "hermes-agent>=0.19.0,<1",
  "litellm>=1.0,<2",
  # Scraping (scrape_page / crawl_site / scrape_to_table). crawl4ai itself is installed with
  # --no-deps by run.bat and scripts/bootstrap.*: it requires "unclecode-litellm", a fork that
  # unpacks into the same `litellm` package and would silently replace the router above.
  # These are crawl4ai's other runtime requirements.
  "playwright>=1.49,<2",
  "patchright>=1.49,<2",
  "playwright-stealth>=2,<3",
  "aiofiles>=24.1",
  "aiosqlite~=0.20",
  "lxml>=5.3,<7",
  "beautifulsoup4~=4.12",
  "cssselect>=1.2",
  "pyOpenSSL>=25.3,<26",
  "fake-useragent>=2.0.3",
  "chardet>=5.2",
  "brotli>=1.1",
  "humanize>=4.10",
  "lark>=1.2.2",
  "alphashape>=1.3.1",
  "shapely>=2",
  "xxhash~=3.4",
  "rank-bm25~=0.2",
  "snowballstemmer~=2.2",
  "nltk>=3.9.1",
  "rapidfuzz>=3,<4",
  "json-repair>=0.30",
  "openpyxl>=3.1,<4",
  # Research reports (deep_research). langchain-openai stays below 1.2: newer releases need
  # openai>=2.45 while hermes-agent pins openai==2.24.
  "gpt-researcher==0.16.1",
  "langchain-openai>=1.1,<1.2",
  "langchain-huggingface>=1.2,<2",
  "sentence-transformers>=5,<7",
  # Research intelligence engine detectors (living_assistant.research).
  "ruptures>=1.1,<2",
  "stumpy>=1.13,<2",
  "drain3>=0.9,<1",
]
[project.optional-dependencies]
desktop = [
  "pyperclip>=1.9,<2",
  "mss>=9,<11",
  "Pillow>=10,<12",
  "pystray>=0.19,<1",
  "customtkinter>=5.2,<6",
  "rapidocr>=3,<4",
]
media = [
  "yt-dlp>=2025.1",
]
browser = [
  "playwright>=1.45,<2",
]
voice = [
  "sounddevice>=0.4,<1",
  "numpy>=1.26,<3",
  "faster-whisper>=1,<2",
  "pyttsx3>=2.90,<3",
]
db = [
  "psycopg[binary]>=3.2,<4",
  "pymysql>=1.1,<2",
  "pymongo>=4.8,<5",
]
airllm = [
  "airllm>=4,<5",
]
peers = [
  "zeroconf>=0.136,<1",
]
connectors = [
  "keyring>=24,<26",
]
dev = [
  "pytest>=8,<10",
  "ruff>=0.8,<1",
]

[project.scripts]
organism = "living_assistant.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
living_assistant = ["default_config.yaml", "default_skills.json", "webui/*.html", "webui/src/*.js", "webui/src/*.css", "webui/dist/*.css", "webui/vendor/*.js", "webui/vendor/*.css", "webui/vendor/*.md", "webui/*.json", "webui/*.js", "webui/*.txt", "webui/*.cjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
