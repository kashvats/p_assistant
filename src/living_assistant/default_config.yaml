profile: auto
workspace_roots:
  - ./workspace

ui:
  activity_history: 500

ollama:
  base_url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
  keep_alive_seconds: 45

model_runtime:
  # auto keeps one model on constrained machines and permits 2-3 resident
  # models only when hardware crosses conservative memory thresholds.
  mode: auto
  max_resident_models: 0
  max_concurrent_generations: 0
  max_parallel_per_model: 1
  resident_keep_alive_seconds: 300
  admission_timeout_seconds: 120
  reserve_ram_gb_by_profile: {lite: 1.0, balanced: 3.0, power: 6.0}
  reserve_vram_gb: 1.0
  dedicated_vram_gb_for_two: 16
  dedicated_vram_gb_for_three: 24
  apple_unified_memory_gb_for_two: 32
  apple_unified_memory_gb_for_three: 64
  cpu_ram_gb_for_two: 48
  cpu_ram_gb_for_three: 96
  force_max_resident: false
  thermal_guard_enabled: true
  max_gpu_temperature_c: 83
  max_cpu_temperature_c: 90

profiles:
  lite:
    min_ram_gb: 0
    context_tokens: 4096
    max_handoffs: 1
    max_tool_steps: 6
    models:
      orchestrator: qwen3.5:0.8b
      general: qwen3.5:0.8b
      coder: qwen3.5:0.8b
      researcher: qwen3.5:0.8b
      security: qwen3.5:0.8b
      database: qwen3.5:0.8b
      planner: qwen3.5:0.8b

  balanced:
    min_ram_gb: 12
    context_tokens: 8192
    max_handoffs: 2
    max_tool_steps: 10
    models:
      orchestrator: qwen3.5:4b
      general: qwen3.5:4b
      coder: qwen3.5:4b
      researcher: qwen3.5:2b
      security: qwen3.5:2b
      database: qwen3.5:2b
      planner: qwen3.5:2b

  power:
    min_ram_gb: 48
    context_tokens: 16384
    max_handoffs: 3
    max_tool_steps: 16
    models:
      orchestrator: qwen3.5:9b
      general: qwen3.5:9b
      coder: qwen3.5:9b
      researcher: qwen3.5:4b
      security: qwen3.5:4b
      database: qwen3.5:4b
      planner: qwen3.5:4b

policy:
  require_execute_approval: true
  require_write_approval: false
  max_download_mb: 25
  max_web_text_chars: 120000
  max_db_rows: 200
  command_timeout_seconds: 120
  specialist_timeout_seconds: 60

daemon:
  poll_seconds: 15
  # A long tick gap is treated as resume-like and ephemeral state is revalidated.
  resume_gap_seconds: 60
  high_memory_percent: 88
  high_cpu_percent: 92
  alert_on_new_listening_port: true
  watch_files: true
  max_watch_events_per_tick: 25


platform_hardening:
  # Copy fallback changes link semantics and is therefore never implicit.
  allow_copy_link_fallback: false

desktop:
  enabled: true
  screenshot_enabled: true
  clipboard_enabled: true
  tray_enabled: true
  computer_use_enabled: true
  vision_enabled: false
  vision_model: null
  allow_remote_vision: false
  input_pause_seconds: 0.08

browser:
  enabled: true
  lite_enabled: false
  headless: false

downloads:
  quarantine_risky_files: true
  quarantine_all_non_images: false

project_groups:
  enabled: true

voice:
  enabled: true
  lite_enabled: false
  stt_model: tiny
  stt_model_lite: tiny
  stt_device: cpu
  stt_compute_type: int8
  language: auto
  tts_rate: 180
  tts_volume: 1.0
  tts_max_chars: 12000
  max_microphone_lease_seconds: 300
  vad:
    block_ms: 80
    calibration_seconds: 0.4
    pre_roll_seconds: 0.24
    min_seconds: 0.35
    silence_seconds: 0.9
    max_seconds: 15
    min_rms: 250
    noise_multiplier: 3.0
  hands_free:
    enabled: false
    lite_enabled: false
    wake_model: ""
    wake_model_name: hey_jarvis
    wake_phrase_text: "hey jarvis"
    wake_audio_tail_seconds: 0.32
    wake_threshold: 0.5
    wake_chunk_ms: 80
    wake_timeout_seconds: 0
    max_listener_lease_seconds: 300
    inference_framework: onnx
    vad_threshold: 0.0
    noise_suppression: false
    barge_in_enabled: true
    barge_in_rms: 1600
    barge_in_blocks: 3

routines:
  enabled: true
  allow_model_wake: false

self_improvement:
  enabled: true
  auto_apply_security_core: false
  evaluation:
    enabled: true
    benchmark_repetitions: 3
    benchmark_repetitions_by_profile: {lite: 1, balanced: 3, power: 5}
    benchmark_warmup_runs: 1
    benchmark_warmup_runs_by_profile: {lite: 0, balanced: 1, power: 1}
    minimum_available_ram_gb_by_profile: {lite: 0.5, balanced: 1.0, power: 2.0}
    max_benchmark_repetitions: 10
    max_latency_regression_pct: 15
    max_memory_regression_pct: 15
    command_timeout_seconds: 300
    max_commands: 12
    max_command_chars: 4000
    copy_max_files: 8000
    copy_max_mb: 500

  sandbox:
    runtime: auto
    lite_enabled: false
    memory_mb: 1024
    cpus: 1.0
    pids_limit: 256
    read_only_root: true
    tmpfs_mb: 128

  canary:
    enabled: true
    observe_seconds_by_profile: {lite: 5, balanced: 15, power: 30}
    startup_timeout_seconds: 30
    min_health_success_pct: 95
    max_latency_regression_pct: 20
    max_memory_regression_pct: 20
    container_memory_mb: 1024
    container_cpus: 1.0
    container_pids_limit: 256


personal:
  timezone: ${ASSISTANT_TIMEZONE:local}
  quiet_hours:
    enabled: false
    start: "22:00"
    end: "07:00"

briefings:
  enabled: true
  cache_seconds: 300
  morning_time: "08:30"
  evening_time: "20:30"
  notify: true
  use_model: false

sessions:
  enabled: true
  retention_days: 30
  max_context_messages: 24
  redact_secrets: true

connectors:
  enabled: true
  use_keyring: true

security_guardian:
  enabled: true
  auto_initialize_baselines: false
  scan_interval_seconds: 300
  posture_interval_seconds: 3600
  integrity_max_files: 1000
  integrity_max_file_mb: 20
  notify_min_severity: medium
  process_alert_score: 60

experience:
  enabled: true
  auto_capture: true
  min_inject_confidence: 0.55
  confidence_half_life_days: 120
  confirmed_half_life_days: 365
  auto_promote_repeats: 2
  episode_retention_days: 30
  max_context_lessons: 5

security_sensors:
  enabled: true
  scan_interval_seconds: 300
  event_lookback_minutes: 10
  max_events_per_scan: 250
  # Local YARA rules are never downloaded automatically.
  yara_rules: []
  yara_max_files: 500
  yara_timeout_seconds: 30
  # Optional NDJSON from a local DNS telemetry collector on platforms where the OS does not expose query events.
  dns_context_jsonl: ""
  # Optional NDJSON produced by a separately privileged local TLS collector.
  # Each line may include: time,pid,process,remote_ip,remote_port,server_name,tls_version,ja3,source.
  tls_context_jsonl: ""
  # macOS Endpoint Security requires Apple's entitlement and a signed native helper.
  macos_endpoint_security_jsonl: ""
  reputation_malicious_threshold: 5
  backup_max_files: 5000
  backup_max_file_mb: 128
  ransomware:
    window_seconds: 20
    file_threshold: 80
    directory_threshold: 5
  network_isolation:
    auto_enabled: false
    auto_armed: false
    auto_required_signals: [mass_file_change, known_malicious_hash]
