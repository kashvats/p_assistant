features:
  - feature_id: "FEAT-19"
    name: "Custom Skill Creation and Execution System"
    state: "ACTIVE"
    operations:
      - id: "CHG-19-01"
        target: "src/living_assistant/skills/"
        type: "CREATE"
        description: "Modular package living_assistant.skills with manifest, package, store, creator, guards, adapters, extractor, runner, collections, and examples."
      - id: "CHG-19-02"
        target: "src/living_assistant/core/skills.py"
        type: "EXTEND"
        description: "Upgrade SkillRegistry to seamlessly wrap SkillManager while maintaining 100% backward-compatible add/list/match/remove interfaces."
      - id: "CHG-19-03"
        target: "src/living_assistant/core/runtime.py"
        type: "EXTEND"
        description: "Initialize SkillManager, register skill tools in tool_registry, and wire into orchestrator context."
      - id: "CHG-19-04"
        target: "src/living_assistant/api_routes/skills.py"
        type: "CREATE"
        description: "REST API router for skill draft creation, lifecycle state changes, testing, execution, rollback, import/export."
      - id: "CHG-19-05"
        target: "src/living_assistant/webui/src/main.js"
        type: "EXTEND"
        description: "Add Skills view to React SPA with search, create modal, detail drawer, test runner, and rollback controls."
      - id: "CHG-19-06"
        target: "tests/test_custom_skills.py"
        type: "CREATE"
        description: "Comprehensive automated test suite covering creation, validation, execution, permissions, dry-run, rollback, and security."

  - feature_id: "FEAT-20"
