features:
  - feature_id: "FEAT-19"
    name: "Custom Skill Creation and Execution System"
    state: "ACTIVE"
    operations:
      - id: "CHG-19-01"
        target: "src/living_assistant/skills/"
        type: "CREATE"
        description: "Modular package living_assistant.skills with manifest, package, store, creator, guards, adapters, extractor, runner, collections, and examples."
      - id: "CHG-19-02"
        target: "src/living_assistant/core/skills.py"
        type: "EXTEND"
        description: "Upgrade SkillRegistry to seamlessly wrap SkillManager while maintaining 100% backward-compatible add/list/match/remove interfaces."
      - id: "CHG-19-03"
        target: "src/living_assistant/core/runtime.py"
        type: "EXTEND"
        description: "Initialize SkillManager, register skill tools in tool_registry, and wire into orchestrator context."
      - id: "CHG-19-04"
        target: "src/living_assistant/api_routes/skills.py"
        type: "CREATE"
        description: "REST API router for skill draft creation, lifecycle state changes, testing, execution, rollback, import/export."
      - id: "CHG-19-05"
        target: "src/living_assistant/webui/src/main.js"
        type: "EXTEND"
        description: "Add Skills view to React SPA with search, create modal, detail drawer, test runner, and rollback controls."
      - id: "CHG-19-06"
        target: "tests/test_custom_skills.py"
        type: "CREATE"
        description: "Comprehensive automated test suite covering creation, validation, execution, permissions, dry-run, rollback, and security."

  - feature_id: "FEAT-20"
    name: "Custom Agent Creation and Management"
    state: "ACTIVE"
    operations:
      - id: "CHG-20-01"
        target: "src/living_assistant/agents/custom/"
        type: "CREATE"
        description: "Modular custom agent system with manifest, package, store, creator, memory, delegation, runner, examples, manager, and tools."
      - id: "CHG-20-02"
        target: "src/living_assistant/core/runtime.py"
        type: "EXTEND"
        description: "Instantiate AgentManager, register agent tools in tool_registry, and pass to Runtime."
      - id: "CHG-20-03"
        target: "src/living_assistant/api_routes/agents.py"
        type: "CREATE"
        description: "REST API router for agent listing, drafting, activation, execution, export, and import."
      - id: "CHG-20-04"
        target: "src/living_assistant/api.py"
        type: "EXTEND"
        description: "Include agents router into FastAPI application."
      - id: "CHG-20-05"
        target: "src/living_assistant/cli/commands.py"
        type: "EXTEND"
        description: "Expose organism agent list, info, draft, activate, disable, test, run, export, import CLI commands."
      - id: "CHG-20-06"
        target: "src/living_assistant/webui/src/main.js"
        type: "EXTEND"
        description: "Add Agents navigation tab, state management, and full UI panel in React dashboard."
      - id: "CHG-20-07"
        target: "tests/test_custom_agents.py"
        type: "CREATE"
        description: "Comprehensive test suite covering agent creation, lifecycle, scoped memory, delegation boundaries, execution bounding, and loop detection."
  - feature_id: "FEAT-21"
    name: "Subprocess Isolation & Advanced LLM Routing"
    state: "ACTIVE"
    operations:
      - id: "CHG-21-01"
        target: "src/living_assistant/core/isolated_executor.py"
        type: "CREATE"
        description: "Added robust subprocess boundary for isolating toxic asyncio/dependency loops."
      - id: "CHG-21-02"
        target: "src/living_assistant/integrations/"
        type: "MODIFY"
        description: "Refactored browser_use, openviking, openmontage, and edge0 to use isolated_executor."
      - id: "CHG-21-03"
        target: "src/living_assistant/core/model_provider.py"
        type: "EXTEND"
        description: "Integrated litellm to support OpenAI, Claude, and llama.cpp/Collibri APIs universally."
      - id: "CHG-21-04"
        target: "src/living_assistant/system/resource_manager.py"
        type: "EXTEND"
        description: "Implemented foolproof metabolize() with deep PyTorch/Ollama VRAM eviction."
  - feature_id: "FEAT-22"
    name: "Production-Grade Edge-Case Hardening (Sections 1-65)"
    state: "ACTIVE"
    operations:
      - id: "CHG-22-01"
        target: "src/living_assistant/system/resource_manager.py"
        type: "EXTEND"
        description: "Added disk pressure detection, thermal monitoring, and load hysteresis to background task throttling."
      - id: "CHG-22-02"
        target: "src/living_assistant/core/model_provider.py"
        type: "EXTEND"
        description: "Added GPU OOM detection, model eviction, cache release, and single-retry fallback loop protection."
      - id: "CHG-22-03"
        target: "src/living_assistant/api.py"
        type: "EXTEND"
        description: "Added strict CORS preflight handling without wildcard exposure and hardened IPv6 bracketed host parsing."
      - id: "CHG-22-04"
        target: "src/living_assistant/tools/shell.py"
        type: "EXTEND"
        description: "Added process group tracking and child process tree cleanup on timeout in run_command, and stop_all in ProcessRegistry."
      - id: "CHG-22-05"
        target: "src/living_assistant/agents/orchestrator.py"
        type: "EXTEND"
        description: "Added tool execution observability telemetry capturing start, end, duration, status, and request IDs."
      - id: "CHG-22-06"
        target: "src/living_assistant/core/runtime.py"
        type: "EXTEND"
        description: "Added coordinated shutdown() method stopping schedulers, browsers, voice workers, subprocesses, and VRAM."
      - id: "CHG-22-07"
        target: "src/living_assistant/system/network_monitor.py"
        type: "CREATE"
        description: "Created NetworkMonitor tracking online/offline states, VPN toggles, adapter changes, and event publishing."
      - id: "CHG-22-08"
        target: "tests/test_edge_cases_sections_51_to_65.py"
        type: "CREATE"
        description: "Created comprehensive automated test suite for production edge-case sections 51 through 65."
  - feature_id: "FEAT-23"
    name: "Production-Grade Edge-Case Hardening (Sections 66-111)"
    state: "ACTIVE"
    operations:
      - id: "CHG-23-01"
        target: "src/living_assistant/core/retry_policy.py"
        type: "CREATE"
        description: "Added differentiated HTTP retry policy with exponential backoff and jitter."
      - id: "CHG-23-02"
        target: "src/living_assistant/core/idempotency.py"
        type: "CREATE"
        description: "Added thread-safe idempotency store preventing duplicate side-effecting operations."
      - id: "CHG-23-03"
        target: "src/living_assistant/system/hardware.py"
        type: "EXTEND"
        description: "Implemented multi-vendor GPU telemetry (NVIDIA, AMD, Intel, Apple, integrated) without CUDA assumptions."
      - id: "CHG-23-04"
        target: "src/living_assistant/skills/manager.py"
        type: "EXTEND"
        description: "Enhanced skill trigger matching with priority and specificity tie-breaking and rollback."
      - id: "CHG-23-05"
        target: "src/living_assistant/agents/custom/manager.py"
        type: "EXTEND"
        description: "Added manifest validation, duplicate name checking, and version rollback to AgentManager."
      - id: "CHG-23-06"
        target: "src/living_assistant/desktop/download_tracker.py"
        type: "CREATE"
        description: "Added BrowserDownloadTracker for normalizing downloads, completion checks, and quarantine."
      - id: "CHG-23-07"
        target: "src/living_assistant/system/graph_validator.py"
        type: "CREATE"
        description: "Implemented SystemGraphValidator verifying system.graph.yaml integrity against code reality."
      - id: "CHG-23-08"
        target: "src/living_assistant/core/config_validator.py"
        type: "CREATE"
        description: "Added ConfigValidator enforcing boundaries for ports, timeouts, URLs, and providers."
      - id: "CHG-23-09"
        target: "src/living_assistant/core/config_manager.py"
        type: "CREATE"
        description: "Implemented ConfigManager for atomic runtime reload, secret rotation, and restart detection."
      - id: "CHG-23-10"
        target: "src/living_assistant/core/migration.py"
        type: "CREATE"
        description: "Created transactional MigrationManager supporting forward upgrades, rollbacks, and halfway failure safety."
      - id: "CHG-23-11"
        target: "src/living_assistant/core/backup.py"
        type: "CREATE"
        description: "Created BackupManager archiving databases, agents, skills, and settings with secret redaction and zip-slip defense."
      - id: "CHG-23-12"
        target: "src/living_assistant/security/audit.py"
        type: "CREATE"
        description: "Added immutable security audit log maintaining audit trail for privileged operations."
      - id: "CHG-23-13"
        target: "tests/test_edge_cases_sections_66_to_80.py"
        type: "CREATE"
        description: "Created automated test suite for Sections 66 through 80."
      - id: "CHG-23-14"
        target: "tests/test_edge_cases_sections_81_to_95.py"
        type: "CREATE"
        description: "Created automated test suite for Sections 81 through 95."
      - id: "CHG-23-15"
        target: "tests/test_edge_cases_sections_96_to_111.py"
        type: "CREATE"
        description: "Created automated test suite for Sections 96 through 111."

