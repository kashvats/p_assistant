        target: "src/living_assistant/integrations/"
        type: "MODIFY"
        description: "Refactored browser_use, openviking, openmontage, and edge0 to use isolated_executor."
      - id: "CHG-21-03"
        target: "src/living_assistant/core/model_provider.py"
        type: "EXTEND"
        description: "Integrated litellm to support OpenAI, Claude, and llama.cpp/Collibri APIs universally."
      - id: "CHG-21-04"
        target: "src/living_assistant/system/resource_manager.py"
        type: "EXTEND"
        description: "Implemented foolproof metabolize() with deep PyTorch/Ollama VRAM eviction."

