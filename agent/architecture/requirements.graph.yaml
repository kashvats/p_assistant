requirements:
  feature_id: "FEAT-19"
  name: "Custom Skill Creation and Execution System"
  status: "requested"
  target_repository: "https://github.com/kashvats/p_assistant"
  platform_constraints:
    current_os: "Windows"
    required_portability: "Ubuntu/Linux, cross-platform"
    hardware_limits: "4GB VRAM, 32GB RAM"
    inference_engines: ["Ollama", "AirLLM"]
  core_requirements:
    - id: "REQ-01"
      title: "Architecture & Tool Registry Audit"
      description: "Extend existing tool registry, orchestrator, approval manager, and model manager without introducing competing frameworks."
      status: "planned"
    - id: "REQ-02"
      title: "Versioned Skill Package Definition"
      description: "Define skills/<skill_id>/ with SKILL.md, manifest.json, examples/, tests/, scripts/ (restricted). Separate package from application-managed lifecycle storage."
      status: "planned"
    - id: "REQ-03"
      title: "Skill Creator Engine"
      description: "Chat/API/UI accessible creation flow converting natural language into structured draft using registered tools only. Bounded prompts and hardware-safe."
      status: "planned"
    - id: "REQ-04"
      title: "Registry & Lifecycle Manager"
      description: "Full lifecycle: create, list, inspect, edit, validate, test, activate, disable, execute, cancel, export, import, rollback, archive. Immutable version snapshots in SQLite."
      status: "planned"
    - id: "REQ-05"
      title: "Discovery & Execution Engine"
      description: "Compact metadata exposure to orchestrator; explicit invocation & semantic suggestions; input validation; dry-run; safe retries; step traces."
      status: "planned"
    - id: "REQ-06"
      title: "Out-of-Model Permission Enforcement"
      description: "Deterministic runtime checks for filesystem scopes, tool allowlists, network, subprocess, destructive operations. Real dry-run adapters."
      status: "planned"
    - id: "REQ-07"
      title: "Portable Tool Adapters"
      description: "Stable tool interfaces (files.list, files.read, files.move, documents.extract, notifications.show). Reversible undo logs. User skills outside install folder."
      status: "planned"
    - id: "REQ-08"
      title: "Skills UI Section"
      description: "React dashboard view in WebUI with list, search, creator, draft editor, permissions, test execution, version comparison/rollback, export/import."
      status: "planned"
    - id: "REQ-09"
      title: "External Skill Collections Integration"
      description: "Selective registration from external-components (Anthropic-Cybersecurity, scientific-skills, agency-agents, diagram-design) with source provenance."
      status: "planned"
    - id: "REQ-10"
      title: "Three Reference Skills"
      description: "Deliver working Daily Briefing, Downloads Organizer, and Invoice Organizer with synthetic test fixtures."
      status: "planned"
    - id: "REQ-11"
      title: "Automated Verification & CI"
      description: "Comprehensive pytest test suite covering full user journey, permission security, dry runs, error recovery, rollback, and restart persistence."
      status: "planned"
