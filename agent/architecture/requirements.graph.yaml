requirements:
  feature_set: "F1-F14"
  name: "Living Assistant & AI Coding Assistant Software Company Integration"
  status: "active"
  target_repository: "c:/Users/human-bot/projects/ai-personal"
  platform_constraints:
    current_os: "Windows"
    required_portability: "Ubuntu/Linux, cross-platform"
    hardware_limits: "4GB VRAM, 32GB RAM"
    inference_engines: ["llama.cpp / Collibri", "Ollama", "AirLLM", "LiteLLM"]
  core_requirements:
    - id: "REQ-F1"
      title: "Hermes Contractor Armored Tool Integration"
      description: "Intercept 100% of Hermes contractor tool calls via _ALLOWED_TOOL_MAPPING; sandbox filesystem and shell actions within Living Assistant ToolRegistry and Workspace."
      feature_id: "F1"
      status: "active"
    - id: "REQ-F2"
      title: "Collibri Local Inference Wiring & Confinement"
      description: "Manage local llama.cpp server supervisor with GPU VRAM lease concurrency and CPU fallback, exposed via LiteLLM endpoint 'openai/collibri'."
      feature_id: "F2"
      status: "active"
    - id: "REQ-F3"
      title: "Brownfield Codebase Pickup & Onboarding Engine"
      description: "Inspect arbitrary codebase paths, parse ASTs, extract dependencies and coding conventions, index symbols, and generate/update system.graph.yaml."
      feature_id: "F3"
      status: "active"
    - id: "REQ-F4"
      title: "Codebase Onboarding CLI & API Endpoints"
      description: "Expose codebase onboarding via CLI ('organism project onboard <path>') and REST endpoint ('POST /projects/onboard')."
      feature_id: "F4"
      status: "active"
    - id: "REQ-F5"
      title: "Personal Assistant Director & Root Domain Routing"
      description: "Preserve Living Assistant as top-level product; classify user intent into 7 domains, generate Directive B4 written specs, require user approval, and coordinate software company dispatch."
      feature_id: "F5"
      status: "active"
    - id: "REQ-F6"
      title: "Dynamic Software Company Organization & Hermes Role Profiles"
      description: "28 dynamic role profiles across 7 departments in Hermes runtime with hierarchical DAG task decomposition (depth <= 3), execution budgets, frozen QA tests, and Final Verifier completion gate."
      feature_id: "F6"
      status: "active"
    - id: "REQ-F7"
      title: "Specialist Roles: Tool Operator & GitHub Researcher"
      description: "Tool Operator for multi-step browser/shell/filesystem pipelines; GitHub Researcher for repository discovery, health/security audit, and license categorization (REUSE, ADAPT, DEPEND, INSPIRE, REJECT)."
      feature_id: "F7"
      status: "active"
    - id: "REQ-F8"
      title: "Task-Scoped Tool Permissions & Dynamic Model Routing"
      description: "Enforce ROLE + TASK + ENVIRONMENT + RESOURCE + RISK = ALLOWED ACTIONS; block modification of frozen QA tests, bound tokens/depth, and route models with VRAM lease management."
      feature_id: "F8"
      status: "active"
    - id: "REQ-F9"
      title: "AI Coding Assistant Unified Router & Developer Endpoints"
      description: "Unify code generation, AST patch engine, project auditor, repair loop, SearXNG search, and developer tools into high-level FastAPI router (api_routes/coding.py)."
      feature_id: "F9"
      status: "active"
    - id: "REQ-F10"
      title: "GEMINI Knowledge Base Synchronization & Architectural Traceability"
      description: "Synchronize system.graph.yaml, requirements.graph.yaml, change.graph.yaml, node-registry.md, agent-flow.mmd, docs/architecture.mmd, and features/registry.md."
      feature_id: "F10"
      status: "active"

    - id: "REQ-F11"
      title: "Autonomous Git Change Manager & Checkpoints"
      description: "Manage task baselines, pre-task checkpoints, commit association, diff inspection, and safe multi-level rollback without destructive resets."
      feature_id: "F11"
      status: "active"

    - id: "REQ-F12"
      title: "Incident Recovery & Human-in-the-Loop Action Approval"
      description: "Automatic vs Approval-Required action classification (blocking production deploy, force push, data wipe, policy alteration) and incident containment/repair loop."
      feature_id: "F12"
      status: "active"

    - id: "REQ-F13"
      title: "Independent QA Rejection Gate & Final Verifier"
      description: "QA independent test execution and rejection feedback loop; Final Verifier as completion gate verifying criteria, tests, security, artifacts, and Git state."
      feature_id: "F13"
      status: "active"

    - id: "REQ-F14"
      title: "Dual-Track Multi-Task Benchmark & Adversarial Verification"
      description: "Comprehensive multi-tier E2E opaque-box benchmark covering onboarding, software company feature delivery, incident recovery, and non-destructive rollbacks."
      feature_id: "F14"
      status: "active"

    - id: "REQ-F15"
      title: "General-Purpose Multi-Archetype App Scaffolding & Requirements Discovery"
      description: "Multi-archetype production scaffolding (Notes, Blog, Expense Tracker, Chat, Contacts, E-Commerce, Custom, Todo), Product Vision Blueprint interactive discovery, anti-loop question capping, and live multi-agent execution timeline visibility."
      feature_id: "F15"
      status: "active"

    - id: "REQ-F16"
      title: "Persistent Skill Learning and Acquisition System"
      description: "Autonomous capability gap detection, multi-source procedural acquisition (docs, repos, tools, traces, feedback), 6-stage lifecycle (PROPOSED -> LEARNING -> TESTING -> VERIFIED -> DEPRECATED | FAILED), isolated sandboxed testing, security permission gating, and persistent catalog publication."
      feature_id: "F16"
      status: "active"

